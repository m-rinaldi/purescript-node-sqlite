name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # node:sqlite prints an ExperimentalWarning on Node 22.x; keep logs clean.
  NODE_NO_WARNINGS: "1"

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Supported lines with unflagged node:sqlite: 22 (LTS, resolves to >= 22.13),
        # 24 (LTS), 26 (Current, LTS from Oct 2026). Drop 22 when it is EOL (Apr 2027).
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Cache spago registry and package sources
        uses: actions/cache@v6
        with:
          # Global cache per `spago ls paths` (Linux): ~/.cache/spago-nodejs
          # Local cache: .spago (unpacked package sources in .spago/p)
          path: |
            ~/.cache/spago-nodejs
            .spago
          key: spago-${{ runner.os }}-${{ hashFiles('spago.lock') }}
          restore-keys: |
            spago-${{ runner.os }}-

      - name: Cache compiler output
        uses: actions/cache@v6
        with:
          path: output
          key: output-${{ runner.os }}-${{ hashFiles('package-lock.json', 'spago.lock') }}-${{ github.sha }}
          restore-keys: |
            output-${{ runner.os }}-${{ hashFiles('package-lock.json', 'spago.lock') }}-

      - name: Install toolchain (purs, spago)
        run: npm ci

      - name: Tool versions
        run: |
          node --version
          npx purs --version
          npx spago --version

      - name: Build (pedantic packages)
        run: npx spago build --pedantic-packages

      - name: Test
        run: npx spago test

      # `spago publish` refuses a dirty tree. If spago rewrote spago.lock or
      # spago.yaml during the build, catch it on the PR instead of at release time.
      - name: Verify spago did not modify tracked files
        run: git diff --exit-code -- spago.yaml spago.lock
