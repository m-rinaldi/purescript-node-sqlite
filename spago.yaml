package:
  name: node-sqlite
  description: PureScript bindings to Node's built-in node:sqlite module
  publish:
    version: 0.1.0
    license: MIT
    location:
      githubOwner: m-rinaldi
      githubRepo: purescript-node-sqlite
  dependencies:
    - bifunctors
    - effect
    - either
    - exceptions
    - foldable-traversable
    - foreign
    - integers
    - lists
