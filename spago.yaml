package:
  name: node-sqlite
  description: Typed PureScript API for Node's built-in node:sqlite module
  publish:
    version: 0.2.0
    license: MIT
    location:
      githubOwner: m-rinaldi
      githubRepo: purescript-node-sqlite
  dependencies:
    - bifunctors: ">=6.1.0 <7.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - either: ">=6.1.0 <7.0.0"
    - exceptions: ">=6.1.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - foreign: ">=7.0.0 <8.0.0"
    - integers: ">=6.0.0 <7.0.0"
    - lists: ">=7.0.0 <8.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - nullable: ">=6.0.0 <7.0.0"
    - prelude: ">=6.0.2 <7.0.0"
    - record: ">=4.0.0 <5.0.0"
    - strings: ">=6.0.1 <7.0.0"
    - transformers: ">=6.1.0 <7.0.0"
    - unsafe-coerce: ">=6.0.0 <7.0.0"
  test:
    main: Test.Main
    dependencies:
      - aff
      - spec
      - spec-node
workspace:
  packageSet:
    registry: 77.3.1
